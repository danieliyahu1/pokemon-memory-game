apiVersion: v1
kind: Service
metadata:
  name: pokemon-memory-game-metrics
  namespace: pokemon-memory-game
  labels:
    app.kubernetes.io/name: pokemon-memory-game
    app.kubernetes.io/component: metrics
spec:
  # Internal only: the public Service never exposes the metrics port.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pokemon-memory-game
    app.kubernetes.io/component: web
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
