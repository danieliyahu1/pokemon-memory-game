# Application credentials come from OCI Vault through the oci-vault
# ClusterSecretStore. Only the vault entry names live in Git; the values are
# supplied out of band. See README.md for the names and how to create them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pokemon-memory-game-secrets
  namespace: pokemon-memory-game
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: pokemon-memory-game-secrets
    creationPolicy: Owner
    # A vault outage must not delete the credentials the running pods use.
    deletionPolicy: Retain
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: pokemon_mongodb_uri
    - secretKey: MONGO_ROOT_PASSWORD
      remoteRef:
        key: pokemon_mongodb_password
    - secretKey: JWT_SECRET
      remoteRef:
        key: pokemon_jwt_secret
    - secretKey: CLOUDINARY_CLOUD_NAME
      remoteRef:
        key: pokemon_cloudinary_cloud_name
    - secretKey: CLOUDINARY_API_KEY
      remoteRef:
        key: pokemon_cloudinary_api_key
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: pokemon_cloudinary_api_secret
