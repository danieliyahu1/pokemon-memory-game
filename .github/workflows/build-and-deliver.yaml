name: Build and deliver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: pokemon-memory-game

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install and build the frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend

      - name: Install, build and test the backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm test --prefix backend

      - name: Validate Kubernetes manifests
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -summary -ignore-missing-schemas deploy/*.yaml

  image:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: verify
    # Native arm64 runners are free for public repositories, and the OCI free
    # tier is Ampere: an amd64 image would fail with `exec format error`.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Immutable per-commit tag: Kubernetes cannot tell that a moving
          # `latest` changed, so the tag is the commit SHA.
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    # Git is the deployment handoff: pin the exact image that was just built
    # and let Argo CD reconcile. The bot commit ends the flow.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin the deployment to the published image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}:${SHA}"
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/[^/]+/${IMAGE_NAME}:[^[:space:]]*$|\1${IMAGE}|" deploy/deployment.yaml
          if grep -q ':bootstrap$' deploy/deployment.yaml; then
            echo "manifest pinning did not match the image line" >&2
            exit 1
          fi
          grep -n 'image: ghcr.io' deploy/deployment.yaml

      - name: Commit the delivery handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin image to ${GITHUB_SHA}"
          git push origin HEAD:main
